      .done{fill:#fff3e6;stroke:#c2410c;stroke-width:2}
      .plan{fill:#f4f4f4;stroke:#8a8a8a;stroke-width:1.6;stroke-dasharray:6 5}
      .pt{font-size:17px;fill:#444;text-anchor:middle}
      .ln{stroke:#5b4636;stroke-width:1.8;fill:none}
      .lp{stroke:#8a8a8a;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
